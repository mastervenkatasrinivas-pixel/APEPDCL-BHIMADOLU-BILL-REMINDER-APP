
name: Build APEPDCL Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -o APEPDCL_BHIMADOLU_BILL_REMINDER.zip -d source

      - name: Build APK
        run: |
          gradle -p source/APEPDCL_Bill_Reminder/android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEPDCL-BHIMADOLU-BILL-REMINDER-APK
          path: source/APEPDCL_Bill_Reminder/android/app/build/outputs/apk/debug/app-debug.apk
